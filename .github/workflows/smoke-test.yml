name: Smoke Test

on:
  repository_dispatch:
    types: [smoke_test]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    description: "Run smoke tests manually"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.10"

      - name: Run scrubbed smoke tests
        run: |
          uv venv .venv
          uv pip install hotglue-smoke-test
          uv pip install --no-deps .
          uv pip install "pipelinewise-singer-python==1.2.0" "hotglue-singer-sdk>=1.0.50,<2.0.0" "hotglue-etl-exceptions==0.1.0" jsonpath-ng "attrs==20.2.0" "pytz==2020.5"
          source .venv/bin/activate
          hotglue-smoke-test run
